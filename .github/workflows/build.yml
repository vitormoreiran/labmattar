name: Validar LABMATTAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto enviado
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -iname 'LABMATTAR_CODIGO_PARA_GITHUB*.zip' -print -quit)
          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d .
          fi
          test -f package.json
          test -f package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Corrigir permissoes de scripts extraidos do ZIP
        run: chmod +x scripts/*.sh
      - name: Compilar
        run: npm run build
      - name: Validar paginas
        if: success()
        run: node --test tests/rendered-html.test.mjs
      - name: Disponibilizar build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: labmattar-previa
          path: |
            dist/
            .next/
          if-no-files-found: warn
