name: Validar LABMATTAR

on:
  push:
    branches: [main, refactor/source-files]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verificar fontes versionadas
        shell: bash
        run: |
          set -euo pipefail
           test -f package.json
          test -f package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Garantir permissao de scripts
        run: chmod +x scripts/*.sh
      - name: Validar contrato funcional do Ambiente Editorial
        run: node scripts/validate-editorial.mjs
      - name: Compilar
        run: npm run build
      - name: Validar entrada editorial e arquivos
        if: success()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          assert.ok(existsSync('dist/server/index.js'), 'Bundle server compilado');
          assert.ok(existsSync('dist/client'), 'Assets client compilados');
          assert.match(readFileSync('app/page.tsx', 'utf8'), /redirect\("\/manual\.html"\)/, 'Capa redireciona para manual');
          assert.ok(existsSync('public/manual.html'), 'Manual editorial presente');
          assert.match(readFileSync('public/manual.html', 'utf8'), /LABMATTAR/);
          console.log('Bundle, rota declarada e manual conferidos.');
          JS
      - name: Disponibilizar build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: labmattar-previa
          path: |
            dist/
            .next/
          if-no-files-found: warn
