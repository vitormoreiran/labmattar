name: Validar LABMATTAR

on:
  push:
    branches: [main, refactor/source-files]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verificar fontes versionadas
        shell: bash
        run: |
          set -euo pipefail
           test -f package.json
          test -f package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Garantir permissao de scripts
        run: chmod +x scripts/*.sh
      - name: Compilar
        run: npm run build
      - name: Validar entrada editorial e arquivos
        if: success()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          const worker = (await import('./dist/server/index.js')).default;
          const result = await worker.fetch(
            new Request('http://localhost/', { headers: { accept: 'text/html' } }),
            { ASSETS: { fetch: async () => new Response('Not found', { status: 404 }) } },
            { waitUntil() {}, passThroughOnException() {} }
          );
          assert.equal(result.status, 307, 'A capa deve redirecionar para o manual');
          assert.ok((result.headers.get('location') || '').endsWith('/manual.html'));
          assert.ok(existsSync('public/manual.html'), 'Manual editorial presente');
          assert.match(readFileSync('public/manual.html','utf8'), /LABMATTAR/);
          console.log('Entrada editorial, redirecionamento e manual validados.');
          JS
      - name: Disponibilizar build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: labmattar-previa
          path: |
            dist/
            .next/
          if-no-files-found: warn
