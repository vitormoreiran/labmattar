name: Validar LABMATTAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Verificar build
        run: npm run build
      - name: Preservar artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: labmattar-previa
          path: |
            dist/
            .next/
          if-no-files-found: warn
