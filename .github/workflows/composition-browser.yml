name: Validar Laboratorio de Composicao

on:
  pull_request:
    paths:
      - 'design/integrate-areas.py'
      - 'design/revise-symbols-hierarchy.py'
      - 'design/motion.html'
      - 'public/motion.css'
      - 'scripts/prepare-motion.mjs'
      - 'scripts/smoke-symbols-browser.mjs'
      - 'design/composicao.html'
      - 'design/laboratorio.html'
      - 'design/compor.html'
      - 'public/laboratorio-index.css'
      - 'public/manual-composition-layout.css'
      - 'public/manual-layout.css'
      - 'design/manual-layout-contract.md'
      - 'design/LABORATORIO_PRODUCAO_EXPORTACAO.md'
      - 'public/composicao-regras.css'
      - 'public/composicao-lab-controls.css'
      - 'public/composicao-lab.css'
      - 'public/composicao-lab.js'
      - 'public/composicao-lab-export.js'
      - 'public/composicao-lab-export.css'
      - 'public/composicao-document.mjs'
      - 'public/composicao-document-ui.mjs'
      - 'scripts/test-composicao-document.mjs'
      - 'scripts/smoke-laboratorio-export.mjs'
      - 'public/composicao-lab-signature.js'
      - 'public/composicao-lab-signature.css'
      - 'scripts/smoke-signature-browser.mjs'
      - 'public/composicao-lab-motion.js'
      - 'public/composicao-studio.css'
      - 'public/composicao-editor-clean.css'
      - 'public/composicao-studio.js'
      - 'public/composicao-acervo.js'
      - 'public/composicao-acervo.css'
      - 'scripts/acervo-api.mjs'
      - 'scripts/test-acervo.mjs'
      - 'scripts/smoke-acervo-ui.mjs'
      - 'scripts/smoke-composition-studio.mjs'
      - 'scripts/smoke-composition-browser.mjs'
      - '.github/workflows/composition-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar contrato de documento v1
        run: node scripts/test-composicao-document.mjs
      - name: Instalar navegador de testes
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Preparar pagina e fontes para teste local
        run: |
          npm ci --prefix tools/matriz-vetorial
          npm run build --prefix tools/matriz-vetorial
          node scripts/prepare-motion.mjs
          for page in tipografia cores composicao laboratorio compor identidade inicio; do cp "design/$page.html" "public/$page.html"; done
          python3 design/integrate-areas.py
          python3 design/revise-symbols-hierarchy.py
          python3 design/validate-identity.py
          node scripts/validate-manual-type-sources.mjs
          mkdir -p public/fonts
          curl --fail --location --retry 3 https://labmattar.com/fonts/univers-lt-std-45-light.otf -o public/fonts/univers-lt-std-45-light.otf
          curl --fail --location --retry 3 https://labmattar.com/fonts/perpetua-titling-light.ttf -o public/fonts/perpetua-titling-light.ttf
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/composicao.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("https://labmattar.com/fonts/univers-lt-std-45-light.otf","/fonts/univers-lt-std-45-light.otf")
          s=s.replace("https://labmattar.com/fonts/perpetua-titling-light.ttf","/fonts/perpetua-titling-light.ttf")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Testar composicoes no navegador
        run: |
          python3 -m http.server 8765 --directory public > /tmp/composicao-http.log 2>&1 &
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-composition-browser.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-composition-studio.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-signature-browser.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-laboratorio-export.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-acervo-ui.mjs
          COMPOSITION_BROWSER=webkit COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-signature-browser.mjs
          COMPOSITION_BROWSER=webkit COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-composition-studio.mjs
          mkdir -p public/vendor
          cp node_modules/gsap/dist/MorphSVGPlugin.js public/vendor/MorphSVGPlugin.js
          MANUAL_URL=http://127.0.0.1:8765/manual.html node scripts/smoke-symbols-browser.mjs
      - name: Salvar capturas para revisao visual
        if: always()
        # A transient failure uploading optional screenshots must not override
        # passing browser/visual-layout assertions in the preceding required step.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: composition-lab-visual-proof
          path: |
            composition-*.png
            laboratorio-*.png
            symbols-proof/
          if-no-files-found: ignore
