name: Validar Ambiente Editorial no navegador
on:
  pull_request:
    paths:
      - 'public/ambiente-editorial/**'
      - 'scripts/smoke-editorial-browser.mjs'
      - '.github/workflows/editorial-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Provisionar fontes oficiais para teste local
        run: |
          mkdir -p public/fonts
          curl --fail --location --retry 3 https://labmattar.com/fonts/univers-lt-std-45-light.otf -o public/fonts/univers-lt-std-45-light.otf
          curl --fail --location --retry 3 https://labmattar.com/fonts/perpetua-titling-light.ttf -o public/fonts/perpetua-titling-light.ttf
      - name: Preparar imagens originais do portfolio
        run: bash scripts/prepare-editorial-media.sh
      - name: Validar editor publicado
        run: |
          python3 -m http.server 8765 --directory public > /tmp/editorial-http.log 2>&1 &
          EDITORIAL_URL=http://127.0.0.1:8765/ambiente-editorial/ node scripts/smoke-editorial-browser.mjs
      - name: Guardar imagens de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-browser-proof
          path: editorial-*.png
          if-no-files-found: ignore
