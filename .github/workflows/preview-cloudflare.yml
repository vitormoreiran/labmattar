name: Publicar previa LABMATTAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - name: Preparar fonte
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -iname 'LABMATTAR_CODIGO_PARA_GITHUB*.zip' -print -quit)
          test -n "$ZIP"
          unzip -oq "$ZIP" -d .
          chmod +x scripts/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Instalar e compilar
        run: |
          npm ci
          npm run build
      - name: Preparar Workers preview
        shell: bash
        run: |
          test -f dist/server/index.js
          test -d dist/client
          cat > wrangler.preview.jsonc <<'JSON'
          {
            "name": "labmattar-identidade-previa",
            "main": "dist/server/index.js",
            "compatibility_date": "2026-10-01",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": "dist/client",
              "binding": "ASSETS"
            },
            "workers_dev": true
          }
          JSON
      - name: Publicar apenas Worker de previa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure o secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure o secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx wrangler deploy --config wrangler.preview.jsonc
