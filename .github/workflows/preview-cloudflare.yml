name: Publicar previa LABMATTAR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/preview-cloudflare.yml'
      - 'design/integrate-areas.py'
      - 'design/revise-symbols-hierarchy.py'
      - 'design/motion.html'
      - 'design/laboratorio.html'
      - 'design/redes.html'
      - 'scripts/smoke-redes-browser.mjs'
      - 'public/redes-acervo/**'
      - 'design/compor.html'
      - 'public/composicao-pages*'
      - 'public/composicao-lab-export.js'
      - 'public/composicao-document-ui.mjs'
      - 'public/lab-*.mjs'
      - 'tools/laboratorio-export/**'
      - 'scripts/prepare-lab-pdf.mjs'
      - 'scripts/test-lab-sequence.mjs'
      - 'scripts/test-private-video-html.mjs'
      - 'scripts/smoke-lab-pages.mjs'
      - 'scripts/smoke-lab-video.mjs'
      - 'scripts/verify-lab-pdf.py'
      - 'package.json'
      - 'package-lock.json'
      - 'design/cores.html'
      - 'public/cores-motion.js'
      - 'scripts/smoke-colors-browser.mjs'
      - 'public/manual.html'
      - 'public/redes*'
      - 'public/motion.css'
      - 'scripts/prepare-motion.mjs'
      - 'scripts/smoke-symbols-browser.mjs'
  push:
    branches: [main, fix/manual-symbols-verified]
    paths:
      - '.github/workflows/preview-cloudflare.yml'
      - 'site-oficial/**'
      - 'presentations/**'
      - 'scripts/*official*'
      - '.github/workflows/publish-official.yml'
      - 'tools/matriz-vetorial/**'
      - 'scripts/prepare-motion.mjs'
      - 'scripts/motion-fingerprint.mjs'
      - 'app/**'
      - 'public/**'
      - 'design/**'
      - 'vite.matrix.config.ts'
      - 'scripts/smoke-symbols-browser.mjs'
      - 'scripts/smoke-matrix-browser.mjs'
      - 'scripts/smoke-composition-studio.mjs'
      - 'scripts/acervo-api.mjs'
      - 'scripts/test-acervo.mjs'
      - 'scripts/smoke-acervo-ui.mjs'
      - 'scripts/wait-symbols-preview.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: labmattar-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - name: Preparar fonte
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -d app
          test -f public/manual.html
          chmod +x scripts/*.sh
          python3 -m py_compile design/*.py
          cat design/labmattar-editor.css >> app/globals.css
          cp design/EditorialAssembly.tsx app/editor/EditorialAssembly.tsx
          cp design/editorial.css app/editor/editorial.css
          python3 design/patch-editor.py
          for page in tipografia cores composicao laboratorio compor identidade inicio redes; do cp "design/$page.html" "public/$page.html"; done
          python3 design/integrate-areas.py
          python3 design/revise-symbols-hierarchy.py
          cp public/manual.html /tmp/manual-once.html
          python3 design/revise-symbols-hierarchy.py
          cmp /tmp/manual-once.html public/manual.html
          git diff --exit-code -- public/identidade
          python3 design/validate-identity.py
          python3 scripts/prepare-identity-kit.py
          python3 design/localize-fonts.py
          node scripts/prepare-identity-review.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Validar tres tratamentos de texto
        run: node scripts/validate-manual-type-sources.mjs
      - name: Preparar Motion e Matriz atual
        run: |
          npm ci --prefix tools/matriz-vetorial
          npm test --prefix tools/matriz-vetorial
          npm run format:check --prefix tools/matriz-vetorial
          npm run build --prefix tools/matriz-vetorial
          node scripts/prepare-motion.mjs
          python3 design/integrate-areas.py motion.html
      - name: Instalar e compilar
        run: |
          npm ci
          mkdir -p public/vendor
          cp node_modules/gsap/dist/MorphSVGPlugin.js public/vendor/MorphSVGPlugin.js
          node --check public/manual-symbols.js
          node --check scripts/smoke-symbols-browser.mjs
          npm run build
          npx vite build --config vite.matrix.config.ts
          mkdir -p dist/client/editor
          cp dist/matrix/design/matrix/index.html dist/client/editor/index.html
          cp -R dist/matrix/matrix-assets dist/client/matrix-assets
      - name: Validar seguranca do acervo
        run: node scripts/test-acervo.mjs
      - name: Validar contratos de páginas e elementos
        run: node --test scripts/test-identity-consistency.mjs scripts/test-lab-sequence.mjs scripts/test-composicao-document.mjs scripts/test-private-video-html.mjs scripts/test-official-publication.mjs scripts/test-lab-section-web.mjs scripts/test-chapter4-publication.mjs
      - name: Preparar Workers preview
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test -f dist/server/index.js
          test -f dist/client/editor/index.html
          test -f dist/client/redes.html
          test -f dist/client/redes.css
          test -f dist/client/redes.js
          cp scripts/acervo-api.mjs dist/server/acervo-api.mjs
          cat > dist/server/worker-entry.js <<'JS'
          import handleRequest from './index.js';
          import { handleAcervoRequest } from './acervo-api.mjs';
          export default {
            fetch(request, env, ctx) {
              const url = new URL(request.url);
              if (url.pathname.startsWith('/api/acervo/')) {
                return handleAcervoRequest(request, env);
              }
              // Keep old Imagem links functional without republishing a sixth chapter.
              if (url.pathname === '/imagem.html' || url.pathname === '/imagem') {
                url.pathname = '/compor.html';
                url.hash = '#laboratorio';
                return Response.redirect(url.toString(), 308);
              }
              return handleRequest(request, ctx);
            }
          };
          JS
          cat > wrangler.preview.jsonc <<'JSON'
          {
            "name": "labmattar-identidade-previa",
            "main": "dist/server/worker-entry.js",
            "compatibility_date": "2026-10-01",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {"directory": "dist/client", "binding": "ASSETS"},
            "workers_dev": true,
            "keep_vars": true,
            "vars": {
              "LM_ACERVO_ORIGIN": "https://labmattar-identidade-previa.vitormoreiran.workers.dev",
              "LM_GOOGLE_CLIENT_ID": "805873227008-c9524mq3ld7apu4rpcb4uo4p4acrcjtn.apps.googleusercontent.com",
              "LM_GOOGLE_APP_ID": "805873227008"
            }
          }
          JSON
      - name: Publicar apenas Worker de previa
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # Preserve Cloudflare dashboard variables and all provider secrets across deploys.
          npx wrangler deploy --config wrangler.preview.jsonc --keep-vars
      - name: Preparar inspeção do PDF
        run: |
          python3 -m pip install --quiet pypdf==6.10.0
          sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15
          sudo apt-get install --no-install-recommends -y poppler-utils ffmpeg
      - name: Instalar navegador de testes
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Validar manual e matriz compilados antes de publicar
        shell: bash
        run: |
          python3 -m http.server 8765 --directory dist/client > /tmp/manual-http.log 2>&1 &
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-lab-pages.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-lab-sections.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-lab-video.mjs
          REDES_URL=http://127.0.0.1:8765/redes.html node scripts/smoke-redes-browser.mjs
          MANUAL_URL=http://127.0.0.1:8765/manual.html node scripts/smoke-symbols-browser.mjs
          COLORS_URL=http://127.0.0.1:8765/cores.html node scripts/smoke-colors-browser.mjs
          EDITOR_URL=http://127.0.0.1:8765/editor/ node scripts/smoke-matrix-browser.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-composition-browser.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-composition-studio.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-signature-browser.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-laboratorio-export.mjs
          COMPOSITION_URL=http://127.0.0.1:8765/compor.html node scripts/smoke-acervo-ui.mjs
          node scripts/smoke-identity-review.mjs
      - name: Conferir pacote do domínio oficial sem publicar
        run: |
          node scripts/build-official.mjs dist/client dist/oficial-checked
          npx --no-install wrangler deploy --dry-run --config dist/oficial-checked/wrangler.jsonc --outdir dist/oficial-check-bundle
      - name: Guardar Laboratório validado para o site oficial
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-site-${{ github.sha }}
          path: dist/client
          retention-days: 7
          if-no-files-found: error
      - name: Confirmar Redes Sociais na URL publicada
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://labmattar-identidade-previa.vitormoreiran.workers.dev/redes.html?commit=${{ github.sha }}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 30 "$URL" -o /tmp/redes-publicadas.html &&
              grep -q 'profile-preview' /tmp/redes-publicadas.html &&
              grep -q 'redes-acervo/poiesis-36.jpg' /tmp/redes-publicadas.html &&
              ! grep -q 'lmSeasonPlanner' /tmp/redes-publicadas.html; then
              echo "Redes Sociais: nova versao publicada e confirmada."
              exit 0
            fi
            echo "Pagina antiga ou incompleta; tentativa $attempt."
            sleep 5
          done
          echo "Redes Sociais: deploy nao confirmado. Consultar passos anteriores."
          exit 1
      - name: Confirmar entrega de fotografia real do 01_Portfolio
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://labmattar-identidade-previa.vitormoreiran.workers.dev/api/acervo/public-media?project=1_IohLr8kwZIQudxG8lmzJvO6GjB3VAWN&id=177GD8UXcmudDYJ8-UKv5O9Mrdd3oOrAv"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -L --max-time 35 --output /tmp/labmattar-drive-photo --write-out '%{http_code}' "$URL") || status=000
            mime=$(file -b --mime-type /tmp/labmattar-drive-photo 2>/dev/null || true)
            bytes=$(wc -c </tmp/labmattar-drive-photo 2>/dev/null || echo 0)
            if [ "$status" = "200" ] && [ "$bytes" -gt 500 ] &&
              { [ "$mime" = "image/jpeg" ] || [ "$mime" = "image/png" ] || [ "$mime" = "image/webp" ]; }; then
              echo "01_Portfolio: imagem real publicada e legivel ($bytes bytes / $mime)."
              exit 0
            fi
            echo "Tentativa $attempt: HTTP $status, mime $mime, bytes $bytes"
            sleep 4
          done
          echo "Falha: Worker nao conseguiu carregar uma fotografia real do acervo."
          exit 1
      - name: Verificar manual e matriz na URL publicada
        if: github.ref == 'refs/heads/main'
        env:
          MANUAL_URL: https://labmattar-identidade-previa.vitormoreiran.workers.dev/manual?verify=${{ github.sha }}
          CHECK_EDITOR: '1'
        run: |
          node scripts/wait-symbols-preview.mjs
          curl --fail --silent --show-error --location https://labmattar-identidade-previa.vitormoreiran.workers.dev/redes.html >/dev/null
          node scripts/smoke-symbols-browser.mjs
          COLORS_URL=https://labmattar-identidade-previa.vitormoreiran.workers.dev/cores.html node scripts/smoke-colors-browser.mjs
      - name: Salvar evidencias visuais e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-symbols-proof-${{ github.sha }}
          path: |
            symbols-proof/
            colors-proof/
            redes-proof/
            production-proof/
            identity-proof/
            laboratorio-export-4k.png
            composition-studio-*.png
          if-no-files-found: warn
