name: Publicar previa LABMATTAR
# Fontes oficiais embutidas na previa, independentes da maquina.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-cloudflare.yml'

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - name: Preparar fonte
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -iname 'LABMATTAR_CODIGO_PARA_GITHUB*.zip' -print -quit)
          test -n "$ZIP"
          unzip -oq "$ZIP" -d .
          chmod +x scripts/*.sh
          cat design/labmattar-editor.css >> app/globals.css
          cp design/EditorialAssembly.tsx app/editor/EditorialAssembly.tsx
          cp design/editorial.css app/editor/editorial.css
          python3 design/patch-editor.py
          cp design/tipografia.html public/tipografia.html
          cp design/cores.html public/cores.html
          cp design/composicao.html public/composicao.html
          cp design/imagem.html public/imagem.html
          cp design/identidade.html public/identidade.html
          python3 design/integrate-areas.py
          python3 design/validate-identity.py
          mkdir -p public/fonts
          curl --fail --location --silent --show-error --retry 3 'https://labmattar.com/fonts/univers-lt-std-45-light.otf' --output public/fonts/univers-lt-std-45-light.otf
          curl --fail --location --silent --show-error --retry 3 'https://labmattar.com/fonts/perpetua-titling-light.ttf' --output public/fonts/perpetua-titling-light.ttf
          python3 - <<'PY'
          from pathlib import Path
          for name in ('univers-lt-std-45-light.otf','perpetua-titling-light.ttf'):
              data=(Path('public/fonts')/name).read_bytes()
              assert len(data)>3000 and data[:4] in (b'OTTO',b'\\x00\\x01\\x00\\x00',b'true',b'ttcf'),f'Invalid font: {name}'
              print(name, len(data), 'bytes OK')
          PY
          python3 design/localize-fonts.py
      - name: Verificar disponibilidade das fontes oficiais
        shell: bash
        run: |
          for font in univers-lt-std-45-light.otf perpetua-titling-light.ttf; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 15 "https://labmattar.com/fonts/$font" || true)
            echo "$font: HTTP $code"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Instalar e compilar
        run: |
          npm ci
          npm run build
      - name: Preparar Workers preview
        shell: bash
        run: |
          test -f dist/server/index.js
          test -d dist/client
          cat > wrangler.preview.jsonc <<'JSON'
          {
            "name": "labmattar-identidade-previa",
            "main": "dist/server/index.js",
            "compatibility_date": "2026-10-01",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": "dist/client",
              "binding": "ASSETS"
            },
            "workers_dev": true
          }
          JSON
      - name: Publicar apenas Worker de previa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure o secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure o secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx wrangler deploy --config wrangler.preview.jsonc
