name: Publicar labmattar.com oficial
on:
  workflow_run:
    workflows: [Publicar previa LABMATTAR]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Execução bem-sucedida de Publicar previa LABMATTAR no main atual
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: labmattar-official
  cancel-in-progress: false
jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reuses the existing account credential stored in this environment.
    # The target is explicitly mattar-portfolio, not the preview Worker.
    environment: preview
    steps:
      - name: Conferir build e revisão exatos
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const runId=context.eventName==='workflow_run'?context.payload.workflow_run.id:Number(context.payload.inputs.build_run_id);
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId});
            const {data:main}=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            if(run.name!=='Publicar previa LABMATTAR'||run.conclusion!=='success'||run.head_branch!=='main'||run.head_repository.full_name!==`${context.repo.owner}/${context.repo.repo}`||!['push','workflow_dispatch'].includes(run.event))throw Error('Use um build validado do repositório oficial no main.');
            if(main.object.sha!==run.head_sha){core.notice('Build anterior ao main atual; publicação ignorada.');core.setOutput('eligible','false');return;}
            core.setOutput('eligible','true');core.setOutput('sha',run.head_sha);core.setOutput('run',String(run.id));
      - uses: actions/checkout@v4
        if: steps.source.outputs.eligible == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.source.outputs.eligible == 'true'
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.eligible == 'true'
        with:
          name: laboratorio-site-${{ steps.source.outputs.sha }}
          path: dist/laboratorio-client
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Montar site oficial e conferir contratos
        if: steps.source.outputs.eligible == 'true'
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
        run: |
          npm ci --ignore-scripts
          node --test scripts/test-official-publication.mjs
          node scripts/build-official.mjs
          node --check dist/oficial/worker/index.js
          node --check dist/oficial/worker/entry.mjs
      - name: Preparar versão no mesmo serviço sem alterar tráfego
        if: steps.source.outputs.eligible == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/official-version.ndjson
        run: |
          node scripts/guard-official-deploy.mjs
          npx --no-install wrangler versions upload --config dist/oficial/wrangler.jsonc --keep-vars --tag github-official-${GITHUB_SHA}
          node scripts/read-official-version.mjs
      - name: Conferir versão preparada e ativar no domínio existente
        if: steps.source.outputs.eligible == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          VERIFY_PREVIEW: '1'
        run: |
          node scripts/verify-official.mjs
          node scripts/guard-official-deploy.mjs
          npx --no-install wrangler versions deploy "${OFFICIAL_VERSION_ID}@100%" --yes --config dist/oficial/wrangler.jsonc
      - name: Conferir publicação servida pelo domínio
        if: steps.source.outputs.eligible == 'true'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/verify-official.mjs
      - name: Guardar pacote e procedência
        if: steps.source.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: labmattar-oficial-${{ steps.source.outputs.sha }}
          path: dist/oficial
          retention-days: 7
