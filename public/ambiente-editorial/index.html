/* Ambiente Editorial: system extracted from the published LABMATTAR code. */
.ed-sheet.ed-original-media{position:relative;isolation:isolate;overflow:hidden;background:#151915;color:#fff}
.ed-sheet.ed-original-media:before{content:"";position:absolute;inset:-6%;background-image:var(--ed-photo);background-position:center;background-size:cover;filter:blur(24px) saturate(.82) brightness(.6);transform:scale(1.06);z-index:-1}
.ed-sheet.ed-original-media .ed-sheet-top,.ed-sheet.ed-original-media .ed-sheet-bottom{color:#fff;border-color:#ffffff99;position:relative;z-index:5}
.ed-sheet.ed-original-media .ed-text-node{color:#fff}
.ed-sheet.ed-original-media .ed-image-field{background:transparent;border:0;position:relative;overflow:visible}
.ed-sheet.ed-original-media .ed-original-image{width:100%;height:100%;aspect-ratio:990.08 / 743.18;-webkit-mask:url("./media/m-publicado.svg") center / contain no-repeat;mask:url("./media/m-publicado.svg") center / contain no-repeat}
.ed-sheet.ed-original-media .ed-original-image img{width:100%;height:100%;display:block;object-fit:cover;max-width:none}
.ed-sheet.ed-original-cover .ed-sheet-content{position:static;display:block;padding:0}

.ed-sheet.ed-original-cover .ed-original-image{position:absolute;inset:0;height:100%;width:100%;aspect-ratio:auto;-webkit-mask-size:100% 100%;mask-size:100% 100%}

.ed-sheet.ed-original-cover .ed-text-node{position:absolute;left:7%;width:75%;pointer-events:auto;margin:0;padding:0}
.ed-sheet.ed-original-cover .role-subtitle{top:18%}
.ed-sheet.ed-original-cover .role-title{top:28%;font-size:clamp(45px,7cqw,110px);line-height:.9}
.ed-sheet.ed-original-cover .role-body{top:75%;max-width:48ch}

.ed-sheet[data-treatment]{container-type:inline-size}

</style></head><body><main class="ed-root"><header class="ed-head"><a class="ed-brand" href="/manual">LABMATTAR</a><span class="ed-head-divider"></span><div class="ed-document"><input id="docTitle" aria-label="Nome da apresentação" value="Cada corpo abre um mundo"><small id="status">RASCUNHO LOCAL</small></div><div class="ed-head-actions"><button id="undo" title="Desfazer (Ctrl+Z)">↶ DESFAZER</button><button id="redo" title="Refazer (Ctrl+Shift+Z)">↷ REFAZER</button><button id="device">MOBILE</button><button id="preview">VISUALIZAR</button><button id="importDoc">ABRIR JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden><button id="download">EXPORTAR JSON ↗</button></div></header><div class="ed-main"><aside class="ed-side"><nav class="ed-side-nav"><button data-tab="pages" class="current">PÁGINAS</button><button data-tab="insert">INSERIR</button><button data-tab="layers">CAMADAS</button><button data-tab="library">ACERVO</button><button data-tab="models">MODELOS</button></nav><div id="sideContent" class="ed-side-content"></div></aside><section class="ed-stage"><div class="ed-stage-bar"><span id="pageIndex">COMPOSIÇÃO / 01</span><span id="viewMode">VISUALIZAÇÃO HORIZONTAL</span></div><div id="sheetWrap" class="ed-sheet-wrap"><article class="ed-sheet" id="sheet"><div class="ed-sheet-top"><span>LABMATTAR</span><span id="sheetCounter">01 / 02</span></div><div class="ed-sheet-content"><div class="ed-texts" id="texts"></div><div class="ed-image-field" id="imageField"></div></div><div class="ed-sheet-bottom"><span>LABMATTAR / IDENTIDADE VISUAL</span><span>2026</span></div></article></div><div class="ed-stage-bottom"><button id="prev">← ANTERIOR</button><span>EDIÇÃO DIRETA / TEXTO E COMPOSIÇÃO</span><button id="next">PRÓXIMA →</button></div><div class="ed-filmstrip" id="filmstrip" aria-label="Sequência de páginas"></div></section><aside class="ed-inspector"><div class="ed-section-heading">PROPRIEDADES <span>↗</span></div><div id="inspector" class="ed-prop"></div></aside></div></main><script>
const makeId=()=>Math.random().toString(36).slice(2,10);

const models={opening:"Abertura imersiva",portfolio:"M integral / portfólio",detail:"Recorte editorial"};

let doc={title:"Cada corpo abre um mundo",pages:structuredClone(starter)};try{const a=JSON.parse(localStorage.getItem("labmattar-editorial-v1")||"null");if(a&&Array.isArray(a.pages)&&a.pages.length)doc={title:a.title||doc.title,pages:a.pages}}catch{}

function restoreHistory(side,other){if(!history[side].length)return;history[other].push(snapshot());doc=JSON.parse(history[side].pop());selected=doc.pages.find(p=>p.id===selected)?.id||doc.pages[0].id;nodeId=null;selectedImage=false;store();draw();updateHistory()}
function updateHistory(){const u=el("undo"),r=el("redo");if(u)u.disabled=!history.past.length;if(r)r.disabled=!history.future.length}
const el=id=>document.getElementById(id),page=()=>doc.pages.find(p=>p.id===selected)||doc.pages[0],escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function draw(){const p=page();p.mode=normalizeMode(p.mode);el("docTitle").value=doc.title;el("pageIndex").textContent="COMPOSIÇÃO / "+String(doc.pages.indexOf(p)+1).padStart(2,"0");el("viewMode").textContent=(mobile?"VISUALIZAÇÃO VERTICAL":"VISUALIZAÇÃO HORIZONTAL")+" · "+models[p.mode];el("sheetCounter").textContent=String(doc.pages.indexOf(p)+1).padStart(2,"0")+" / "+String(doc.pages.length).padStart(2,"0");
el("sheet").className="ed-sheet mode-"+p.mode;el("sheetWrap").classList.toggle("mobile",mobile);document.querySelector(".ed-root").classList.toggle("is-preview",preview);el("device").textContent=mobile?"DESKTOP":"MOBILE";el("preview").textContent=preview?"EDITAR":"VISUALIZAR";
el("texts").innerHTML=p.nodes.map(n=>'<div class="ed-text-node role-'+n.role+(n.id===nodeId?' selected':'')+'" contenteditable="'+(!preview)+'" role="textbox" data-node="'+n.id+'" aria-label="'+n.role+'">'+escape(n.text)+'</div>').join("");
const field=el("imageField");field.classList.toggle("empty",!p.images.length);const first=p.images[0];const src=first&&(typeof first==="string"?first:first.src);const sheet=el("sheet");sheet.classList.toggle("ed-original-media",!!src);sheet.classList.toggle("ed-original-cover",!!src&&p.mode==="opening");sheet.classList.toggle("ed-original-editorial",!!src&&p.mode!=="opening");sheet.dataset.treatment=p.mode;sheet.style.setProperty("--ed-photo",src?"url("+JSON.stringify(src)+")":"none");field.innerHTML=src?'<div class="ed-original-image"><img alt="Imagem LABMATTAR mascarada pelo M" src="'+escape(src)+'"></div>':'<div class="ed-image-empty"><span>IMAGEM</span><button id="addFromSheet">+ INSERIR DO ACERVO</button></div>';
document.querySelectorAll("[data-node]").forEach(e=>{e.onclick=()=>{nodeId=e.dataset.node;drawInspector()};e.onblur=()=>{const n=p.nodes.find(n=>n.id===e.dataset.node);if(n){const copy=e.cloneNode(true);copy.querySelectorAll(".ed-grip").forEach(x=>x.remove());const txt=copy.innerText;if(n.text!==txt){checkpoint();n.text=txt;store();drawInspector()}}}});if(el("addFromSheet"))el("addFromSheet").onclick=()=>{tab="library";drawSide()};
drawSide();drawInspector();attachCanvas();applyImageControls();drawFilmstrip();updateHistory();el("prev").disabled=doc.pages.indexOf(p)===0;el("next").disabled=doc.pages.indexOf(p)===doc.pages.length-1}
function drawSide(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("current",b.dataset.tab===tab));const p=page(),out=el("sideContent");
if(tab==="insert"){out.innerHTML='<div class="ed-section-heading">INSERIR ELEMENTO</div><button class="ed-solid" id="addTitle">+ TÍTULO</button><button class="ed-linkbtn" id="addSubtitle">+ SUBTÍTULO</button><button class="ed-linkbtn" id="addBody">+ CORPO DE TEXTO</button><button class="ed-linkbtn" id="insertImage">+ IMAGEM</button><p class="ed-small">Clique para inserir. Selecione e arraste pelo marcador para posicionar.</p>';for(const [id,role,label] of [["addTitle","title","NOVO TÍTULO"],["addSubtitle","subtitle","Subtítulo"],["addBody","body","Escreva aqui"]])el(id).onclick=()=>{checkpoint();let n={id:makeId(),role,text:label,geometry:{x:8,y:role==="body"?72:role==="subtitle"?18:34,w:role==="title"?77:52}};p.nodes.push(n);nodeId=n.id;store();draw()};el("insertImage").onclick=()=>{tab="library";drawSide()}}

if(tab==="models"){out.innerHTML='<div class="ed-section-heading">ESTRUTURAS DO SITE PUBLICADO</div>'+Object.entries(models).map(([id,label])=>'<button class="ed-model '+(p.mode===id?'active':'')+'" data-model="'+id+'"><span class="ed-model-diagram '+id+'"><i></i><i></i><i></i></span><span>'+label+'</span><span>↗</span></button>').join("")+'<div class="ed-section-heading" style="margin-top:25px">EXEMPLOS DO ACERVO</div>'+samples.map((x,i)=>'<button class="ed-model" data-example="'+i+'"><span class="ed-model-diagram"><img style="width:100%;height:100%;object-fit:cover" src="'+escape(x.url)+'" alt=""></span><span>'+escape(x.label)+'</span><span>↗</span></button>').join("")+'<p class="ed-small">Estruturas baseadas no M e no ambiente imagético do portfólio. Os exemplos inserem imagens reais do acervo na página atual.</p>';out.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>{checkpoint();p.mode=b.dataset.model;store();draw()});out.querySelectorAll("[data-example]").forEach(b=>b.onclick=()=>{const x=samples[Number(b.dataset.example)];checkpoint();p.mode=x.mode;p.images=[x.url];store();draw()})}
if(tab==="library"){out.innerHTML='<div class="ed-section-heading">IMAGENS</div><p class="ed-small">Insira uma imagem local ou uma URL de mídia. A imagem será usada nesta página.</p><input type="file" id="upload" accept="image/*" hidden><button id="uploadButton" class="ed-solid">+ ADICIONAR IMAGEM</button><label class="ed-label" for="imageUrl">OU INSERIR URL DA IMAGEM</label><input class="ed-input" id="imageUrl" placeholder="https://..."><button class="ed-linkbtn" id="addUrl">INSERIR ↗</button><div class="ed-media-list">'+p.images.map((img,i)=>'<div class="ed-media"><img alt="Imagem" src="'+escape(img)+'"><button data-remove="'+i+'">×</button></div>').join("")+'</div><p class="ed-small">Acervo ainda local: sem sincronização institucional.</p>';el("uploadButton").onclick=()=>el("upload").click();el("upload").onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>1500000){alert("Imagem de até 1,5 MB nesta versão local.");return}const rd=new FileReader();rd.onload=()=>{checkpoint();p.images.push(String(rd.result));store();draw()};rd.readAsDataURL(file)};el("addUrl").onclick=()=>{const v=el("imageUrl").value.trim();if(!/^https:\/\//.test(v))return alert("Insira uma URL HTTPS.");checkpoint();p.images.push(v);store();draw()};out.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{checkpoint();p.images.splice(Number(b.dataset.remove),1);store();draw()})}}
function drawInspector(){const p=page(),n=p.nodes.find(n=>n.id===nodeId),ins=el("inspector");if(n){ins.innerHTML='<p>ELEMENTO / '+n.role.toUpperCase()+'</p><label>FUNÇÃO EDITORIAL</label><strong>'+({title:"TÍTULO",subtitle:"SUBTÍTULO",body:"CORPO"}[n.role])+'</strong><label>CONTEÚDO</label><textarea id="editText" rows="7">'+escape(n.text)+'</textarea><p class="ed-prop-note">Texto editável diretamente sobre a página, com alinhamento e fontes do sistema.</p>';el("editText").onfocus=()=>checkpoint();el("editText").oninput=e=>{n.text=e.target.value;const item=document.querySelector('[data-node="'+n.id+'"]');if(item)item.textContent=n.text;store()}}
else{ins.innerHTML='<p>SUPERFÍCIE / '+escape(p.name.toUpperCase())+'</p><label>NOME DA PÁGINA</label><input id="pageName" value="'+escape(p.name)+'"><label>ESTRUTURA</label><select id="pageMode">'+Object.entries(models).map(([id,name])=>'<option value="'+id+'" '+(p.mode===id?'selected':'')+'>'+name+'</option>').join("")+'</select><label>ORGANIZAÇÃO</label><div class="ed-prop-buttons"><button id="duplicate">DUPLICAR</button><button id="removePage">EXCLUIR</button></div><p class="ed-prop-note">Conteúdo preservado ao alterar modelos.</p>';el("pageName").oninput=e=>{p.name=e.target.value;store();drawSide()};el("pageMode").onchange=e=>{checkpoint();p.mode=e.target.value;store();draw()};el("duplicate").onclick=()=>{const copy=structuredClone(p);copy.id=makeId();copy.name+=" — cópia";copy.nodes.forEach(n=>n.id=makeId());checkpoint();doc.pages.splice(doc.pages.indexOf(p)+1,0,copy);selected=copy.id;store();draw()};el("removePage").onclick=()=>{if(doc.pages.length<2)return;if(!confirm("Excluir esta página?"))return;checkpoint();doc.pages.splice(doc.pages.indexOf(p),1);selected=doc.pages[0].id;nodeId=null;store();draw()}}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;drawSide()});el("docTitle").oninput=e=>{doc.title=e.target.value;store()};el("device").onclick=()=>{mobile=!mobile;draw()};el("preview").onclick=()=>{preview=!preview;draw()};el("prev").onclick=()=>{const i=doc.pages.indexOf(page());if(i>0){selected=doc.pages[i-1].id;nodeId=null;draw()}};el("next").onclick=()=>{const i=doc.pages.indexOf(page());if(i<doc.pages.length-1){selected=doc.pages[i+1].id;nodeId=null;draw()}};el("download").onclick=()=>{const blob=new Blob([JSON.stringify({schemaVersion:1,...doc},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="labmattar-apresentacao.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};draw();

function attachCanvas(){const p=page(),sheet=el("sheet");p.nodes.forEach(n=>{const element=sheet.querySelector('[data-node="'+n.id+'"]');if(!element)return;const g=n.geometry||{};if(sheet.classList.contains("ed-original-media")){element.style.left=(g.x??8)+"%";element.style.top=(g.y??(n.role==="title"?29:n.role==="subtitle"?19:72))+"%";element.style.bottom="auto";element.style.width=(g.w??(n.role==="title"?77:50))+"%";element.style.zIndex=String(g.z??5)}if(!preview){element.insertAdjacentHTML("beforeend",'<span class="ed-grip" contenteditable="false" title="Arrastar elemento">✥</span>');const grip=element.querySelector(".ed-grip");grip.onpointerdown=e=>{e.preventDefault();e.stopPropagation();nodeId=n.id;selectedImage=false;sheet.querySelectorAll(".ed-text-node").forEach(x=>x.classList.toggle("selected",x===element));checkpoint();const rect=sheet.getBoundingClientRect(),startX=e.clientX,startY=e.clientY,g0={x:g.x??8,y:g.y??(n.role==="title"?29:n.role==="subtitle"?19:72),w:g.w??77};const move=ev=>{const x=Math.max(0,Math.min(95,g0.x+(ev.clientX-startX)/rect.width*100)),y=Math.max(0,Math.min(95,g0.y+(ev.clientY-startY)/rect.height*100));n.geometry={...n.geometry,x,y,w:g0.w};element.style.left=x+"%";element.style.top=y+"%"};const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);store();drawInspector()};window.addEventListener("pointermove",move);window.addEventListener("pointerup",up)};}});
const img=sheet.querySelector(".ed-original-image");if(img&&!preview){img.style.pointerEvents="auto";img.style.cursor="pointer";img.onclick=()=>{selectedImage=true;nodeId=null;drawInspector()}}}
function addImageControls(ins,p){const g=p.imageSettings||(p.imageSettings={x:50,y:50,scale:100,blur:24});ins.insertAdjacentHTML("beforeend",'<p class="ed-prop-note">IMAGEM / ENQUADRAMENTO</p><label>FOCO HORIZONTAL</label><input data-image-prop="x" type="range" min="0" max="100" value="'+g.x+'"><label>FOCO VERTICAL</label><input data-image-prop="y" type="range" min="0" max="100" value="'+g.y+'"><label>ESCALA DA IMAGEM</label><input data-image-prop="scale" type="range" min="100" max="240" value="'+g.scale+'"><label>DESFOQUE AMBIENTE</label><input data-image-prop="blur" type="range" min="0" max="60" value="'+g.blur+'"><p class="ed-control-note">O foco e a escala pertencem a esta página, não ao arquivo original.</p>');ins.querySelectorAll("[data-image-prop]").forEach(x=>{x.onpointerdown=()=>checkpoint();x.oninput=()=>{g[x.dataset.imageProp]=Number(x.value);applyImageControls();store()}})}
function applyImageControls(){const p=page(),g=p.imageSettings||{x:50,y:50,scale:100,blur:24},sheet=el("sheet");sheet.style.setProperty("--ed-focus-x",g.x+"%");sheet.style.setProperty("--ed-focus-y",g.y+"%");sheet.style.setProperty("--ed-scale",g.scale/100);sheet.style.setProperty("--ed-ambient-blur",g.blur+"px")}
function enhanceInspector(){const p=page(),n=p.nodes.find(n=>n.id===nodeId),ins=el("inspector");if(n){let g=n.geometry||{};ins.insertAdjacentHTML("beforeend",'<p class="ed-prop-note">POSIÇÃO / ELEMENTO</p><div class="ed-two"><label>X (%)<input data-geometry="x" type="number" min="0" max="95" value="'+(g.x??8)+'"></label><label>Y (%)<input data-geometry="y" type="number" min="0" max="95" value="'+(g.y??(n.role==="title"?29:n.role==="subtitle"?19:72))+'"></label></div><label>LARGURA (%)</label><input data-geometry="w" type="range" min="15" max="95" value="'+(g.w??75)+'"><div class="ed-prop-buttons"><button id="duplicateText">DUPLICAR TEXTO</button><button id="deleteText">EXCLUIR TEXTO</button></div>');ins.querySelectorAll("[data-geometry]").forEach(x=>{x.onfocus=()=>checkpoint();x.oninput=()=>{n.geometry={...n.geometry,[x.dataset.geometry]:Number(x.value)};const eln=document.querySelector('[data-node="'+n.id+'"]');if(eln){eln.style.left=(n.geometry.x??8)+"%";eln.style.top=(n.geometry.y??29)+"%";eln.style.width=(n.geometry.w??75)+"%"}store()}});el("duplicateText").onclick=()=>{checkpoint();const copy=structuredClone(n);copy.id=makeId();copy.geometry={...n.geometry,x:(n.geometry?.x??8)+3,y:(n.geometry?.y??29)+5};p.nodes.push(copy);nodeId=copy.id;store();draw()};el("deleteText").onclick=()=>{checkpoint();p.nodes=p.nodes.filter(x=>x.id!==n.id);nodeId=null;store();draw()};}

else if(p.images.length){addImageControls(ins,p)}}

el("importDoc").onclick=()=>el("importFile").click();el("importFile").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.pages)||!data.pages.length||!data.pages.every(p=>Array.isArray(p.nodes)&&Array.isArray(p.images)))throw new Error("Estrutura de documento inválida");checkpoint();doc={title:String(data.title||"Documento"),pages:data.pages.map(p=>({...p,mode:normalizeMode(p.mode)}))};selected=doc.pages[0].id;nodeId=null;selectedImage=false;store();draw()}catch(err){alert("Não foi possível importar o documento: "+err.message)}e.target.value=""};
