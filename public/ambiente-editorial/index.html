function drawSide(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("current",b.dataset.tab===tab));const p=page(),out=el("sideContent");
if(tab==="pages"){out.innerHTML='<div class="ed-section-heading"><span>SEQUÊNCIA / '+String(doc.pages.length).padStart(2,"0")+'</span><button id="newPage">+ NOVA</button></div>'+doc.pages.map((q,i)=>'<button class="ed-page-item '+(q.id===selected?'active':'')+'" data-page="'+q.id+'"><span class="ed-page-num">'+String(i+1).padStart(2,"0")+'</span><span>'+escape(q.name)+'<small>'+models[q.mode]+'</small></span><span class="ed-page-arrow">↗</span></button>').join("")+'<p class="ed-side-help">Selecione uma página para compor, editar e reorganizar.</p>';el("newPage").onclick=()=>{const id=makeId();doc.pages.push({id,name:"Nova página",mode:"portfolio",nodes:["title","subtitle","body"].map((role,i)=>({id:makeId(),role,text:["NOVO TÍTULO","SUBTÍTULO","Escreva o conteúdo da página."][i]})),images:[]});selected=id;nodeId=null;store();draw()};out.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{selected=b.dataset.page;nodeId=null;draw()})}
if(tab==="models"){out.innerHTML='<div class="ed-section-heading">ESTRUTURAS DO SITE PUBLICADO</div>'+Object.entries(models).map(([id,label])=>'<button class="ed-model '+(p.mode===id?'active':'')+'" data-model="'+id+'"><span class="ed-model-diagram '+id+'"><i></i><i></i><i></i></span><span>'+label+'</span><span>↗</span></button>').join("")+'<div class="ed-section-heading" style="margin-top:25px">EXEMPLOS DO ACERVO</div>'+samples.map((x,i)=>'<button class="ed-model" data-example="'+i+'"><span class="ed-model-diagram"><img style="width:100%;height:100%;object-fit:cover" src="'+escape(x.url)+'" alt=""></span><span>'+escape(x.label)+'</span><span>↗</span></button>').join("")+'<p class="ed-small">Estruturas baseadas no M e no ambiente imagético do portfólio. Os exemplos inserem imagens reais do acervo na página atual.</p>';out.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>{p.mode=b.dataset.model;store();draw()});out.querySelectorAll("[data-example]").forEach(b=>b.onclick=()=>{const x=samples[Number(b.dataset.example)];p.mode=x.mode;p.images=[x.url];store();draw()})}
if(tab==="library"){out.innerHTML='<div class="ed-section-heading">IMAGENS</div><p class="ed-small">Insira uma imagem local ou uma URL de mídia. A imagem será usada nesta página.</p><input type="file" id="upload" accept="image/*" hidden><button id="uploadButton" class="ed-solid">+ ADICIONAR IMAGEM</button><label class="ed-label" for="imageUrl">OU INSERIR URL DA IMAGEM</label><input class="ed-input" id="imageUrl" placeholder="https://..."><button class="ed-linkbtn" id="addUrl">INSERIR ↗</button><div class="ed-media-list">'+p.images.map((img,i)=>'<div class="ed-media"><img alt="Imagem" src="'+escape(img)+'"><button data-remove="'+i+'">×</button></div>').join("")+'</div><p class="ed-small">Acervo ainda local: sem sincronização institucional.</p>';el("uploadButton").onclick=()=>el("upload").click();el("upload").onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>1500000){alert("Imagem de até 1,5 MB nesta versão local.");return}const rd=new FileReader();rd.onload=()=>{p.images.push(String(rd.result));store();draw()};rd.readAsDataURL(file)};el("addUrl").onclick=()=>{const v=el("imageUrl").value.trim();if(!/^https:\/\//.test(v))return alert("Insira uma URL HTTPS.");p.images.push(v);store();draw()};out.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{p.images.splice(Number(b.dataset.remove),1);store();draw()})}}
function drawInspector(){const p=page(),n=p.nodes.find(n=>n.id===nodeId),ins=el("inspector");if(n){ins.innerHTML='<p>ELEMENTO / '+n.role.toUpperCase()+'</p><label>FUNÇÃO EDITORIAL</label><strong>'+({title:"TÍTULO",subtitle:"SUBTÍTULO",body:"CORPO"}[n.role])+'</strong><label>CONTEÚDO</label><textarea id="editText" rows="7">'+escape(n.text)+'</textarea><p class="ed-prop-note">Texto editável diretamente sobre a página, com alinhamento e fontes do sistema.</p>';el("editText").oninput=e=>{n.text=e.target.value;const item=document.querySelector('[data-node="'+n.id+'"]');if(item)item.textContent=n.text;store()}}
else{ins.innerHTML='<p>SUPERFÍCIE / '+escape(p.name.toUpperCase())+'</p><label>NOME DA PÁGINA</label><input id="pageName" value="'+escape(p.name)+'"><label>ESTRUTURA</label><select id="pageMode">'+Object.entries(models).map(([id,name])=>'<option value="'+id+'" '+(p.mode===id?'selected':'')+'>'+name+'</option>').join("")+'</select><label>ORGANIZAÇÃO</label><div class="ed-prop-buttons"><button id="duplicate">DUPLICAR</button><button id="removePage">EXCLUIR</button></div><p class="ed-prop-note">Conteúdo preservado ao alterar modelos.</p>';el("pageName").oninput=e=>{p.name=e.target.value;store();drawSide()};el("pageMode").onchange=e=>{p.mode=e.target.value;store();draw()};el("duplicate").onclick=()=>{const copy=structuredClone(p);copy.id=makeId();copy.name+=" — cópia";copy.nodes.forEach(n=>n.id=makeId());doc.pages.splice(doc.pages.indexOf(p)+1,0,copy);selected=copy.id;store();draw()};el("removePage").onclick=()=>{if(doc.pages.length<2)return;if(!confirm("Excluir esta página?"))return;doc.pages.splice(doc.pages.indexOf(p),1);selected=doc.pages[0].id;nodeId=null;store();draw()}}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;drawSide()});el("docTitle").oninput=e=>{doc.title=e.target.value;store()};el("device").onclick=()=>{mobile=!mobile;draw()};el("preview").onclick=()=>{preview=!preview;draw()};el("prev").onclick=()=>{const i=doc.pages.indexOf(page());if(i>0){selected=doc.pages[i-1].id;nodeId=null;draw()}};el("next").onclick=()=>{const i=doc.pages.indexOf(page());if(i<doc.pages.length-1){selected=doc.pages[i+1].id;nodeId=null;draw()}};el("download").onclick=()=>{const blob=new Blob([JSON.stringify({schemaVersion:1,...doc},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="labmattar-apresentacao.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};draw();
</script></body></html>
