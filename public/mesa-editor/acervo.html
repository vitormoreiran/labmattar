<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Acervo de modelos · Mesa Unificada</title>
  <link rel="stylesheet" href="/manual-headings.css">
  <link rel="stylesheet" href="/mesa-editor/modelos.css">
  <script type="module" src="/mesa-editor/modelos.mjs"></script>
</head>
<body class="model-library">
  <main>
    <header class="model-intro">
      <h1 id="acervo-title">Acervo de <span>modelos</span></h1>
    </header>
    <div class="model-workspace">
      <nav id="model-collection" aria-label="Modelos disponíveis"></nav>
      <section id="model-detail" aria-labelledby="model-name">
        <div class="model-toolbar">
          <div>
            <h2 id="model-name"></h2>
            <p id="model-meta"></p>
          </div>
          <button class="model-primary" id="use-model" type="button">Criar em Montar</button>
        </div>
        <div class="model-stage">
          <div class="model-sheet" aria-hidden="true">
            <span class="model-sheet-signature">LABMATTAR</span>
            <strong id="sheet-title"></strong>
            <p id="sheet-body"></p>
          </div>
        </div>
        <div id="model-pager" hidden>
          <p id="model-page" aria-live="polite"></p>
          <div role="group" aria-label="Páginas do modelo">
            <button id="model-prev" type="button" aria-label="Página anterior">←</button>
            <span id="model-page-count"></span>
            <button id="model-next" type="button" aria-label="Próxima página">→</button>
          </div>
        </div>
      </section>
    </div>
  </main>
  <dialog id="model-dialog" aria-labelledby="model-dialog-title">
    <form>
      <h2 id="model-dialog-title">Usar modelo</h2>
      <label for="project-name">Nome do novo projeto</label>
      <input id="project-name" name="name" maxlength="120" required>
      <p id="model-status" role="status"></p>
      <div class="model-dialog-actions">
        <button type="button" id="cancel-model">Cancelar</button>
        <button class="model-primary" type="submit">Criar rascunho</button>
      </div>
    </form>
  </dialog>
</body>
</html>
